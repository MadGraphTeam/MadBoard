[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madboard"
version = "0.1.8"
description = "Modern web interface for the MadGraph7 event generator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Theo Heimel", email = "theo.heimel@uclouvain.be"}
]
keywords = ["flask", "react", "web-application"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "waitress>=3.0.0",
]

[project.scripts]
madboard = "madboard.backend.server:run_server"

[project.urls]
Homepage = "https://github.com/theoheimel/madboard"
Documentation = "https://github.com/theoheimel/madboard#readme"
Repository = "https://github.com/theoheimel/madboard.git"
Issues = "https://github.com/theoheimel/madboard/issues"

[tool.setuptools]
packages = ["madboard", "madboard.backend"]
include-package-data = true

[tool.setuptools.package-data]
madboard = [
    "frontend/build/**/*",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
